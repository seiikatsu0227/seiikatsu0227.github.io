<!doctype html>
<meta charset="utf-8">
<title>pushtest</title>
<pre id="out">loading…</pre>
<script>
const VAPID = "BJoPL94z4ZxSKwlbKt_bZUmD3bllCwA2KkA68BN3zTEoC7jErR0zyWnepx-VjfdI7NRe7WMa86QR7D6v0YfGfdc=";
const out = document.getElementById('out');
const log = m => { out.textContent += "\n" + m; };
window.addEventListener('unhandledrejection', e => log('REJECT: ' + (e.reason && e.reason.message || e.reason)));
(async () => {
  out.textContent = 'ready';
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) { out.textContent = 'NO PUSH API'; return; }
  try {
    const reg = await navigator.serviceWorker.register('/pushtest/sw.js', { scope: '/pushtest/' });
    log('sw registered scope=' + reg.scope);
    const perm = await Notification.requestPermission();
    log('perm=' + perm);
    if (perm !== 'granted') return;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(atob(VAPID.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0)) });
    localStorage.setItem('sub', JSON.stringify(sub));
    out.textContent = 'SUB=' + JSON.stringify(sub) + '\n---\n(copy the SUB= line)';
    navigator.serviceWorker.addEventListener('message', e => log('MSG: ' + JSON.stringify(e.data)));
  } catch (e) { out.textContent = 'ERROR: ' + e.message; }
})();
</script>
